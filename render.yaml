# Alpendre 1.2.0 — áudio da tela e persistência opcional
services:
  - type: web
    name: lume-app
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
